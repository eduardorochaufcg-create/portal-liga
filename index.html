<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Portal da Liga</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F766E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liga">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#F1F5F9;--card:#fff;--txt:#1E293B;--mut:#64748B;--pri:#0F766E;--hdr:#0F766E;--hdrtxt:#fff;--line:#E2E8F0}
body.gestao{--bg:#0B1220;--card:#131C2E;--txt:#E2E8F0;--mut:#94A3B8;--pri:#FACC15;--hdr:#0F172A;--hdrtxt:#FDE68A;--line:#25314A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:var(--hdr);color:var(--hdrtxt);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top b{font-size:18px}.badge{font-size:11px;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px;margin-left:8px}
.top .acoes{display:flex;align-items:center;gap:8px}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 16px;min-height:42px;font-weight:bold;font-size:14px;background:var(--pri);color:#fff;font-family:inherit}
body.gestao button{color:#0F172A}
button.sec{background:transparent;border:1px solid currentColor;color:inherit}
button:disabled{opacity:.5;cursor:wait}
.wrap{max-width:1100px;margin:0 auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.login{max-width:380px;margin:40px auto}
.login h2{display:flex;align-items:center;gap:10px}
.login h2 img{width:36px;height:36px;border-radius:8px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin:6px 0 10px;background:#fff;color:#1E293B;font-family:inherit}
.msg{font-size:13px;color:#B45309;min-height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.kpi small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.kpi span{font-size:26px;font-weight:bold;color:var(--pri)}
.big{font-size:64px;font-weight:bold;color:var(--pri);line-height:1}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:bold}
.URGENTE{background:#FEE2E2;color:#B91C1C}.ATENÇÃO{background:#FEF3C7;color:#B45309}.REGULAR{background:#DCFCE7;color:#166534}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--pri)}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.tabs button.on{background:var(--pri);color:#0F172A}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dep{border-left:6px solid;padding-left:12px;margin-bottom:10px}
.filtros{display:flex;gap:8px;flex-wrap:wrap}.filtros input,.filtros select{flex:1;min-width:140px;margin:0 0 10px}
.aviso{background:#FEF3C7;color:#92400E;border-radius:10px;padding:12px;margin-bottom:14px}
.offline{background:#E0F2FE;color:#075985;border-radius:10px;padding:12px;margin-bottom:14px;font-size:14px}
.mut{color:var(--mut);font-size:13px}
.instalar{display:none;background:#0F766E;color:#fff;padding:10px 14px;font-size:14px;align-items:center;justify-content:space-between;gap:10px}
.instalar button{background:#fff;color:#0F766E;min-height:36px;padding:6px 14px}
.instalar .x{background:transparent;color:#fff;font-size:18px;padding:4px 8px;min-height:0}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:16px;z-index:9}
.box{background:var(--card);color:var(--txt);border-radius:12px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.box label{display:block;font-size:12px;color:var(--mut);margin-top:6px}
button.mini{padding:4px 10px;min-height:32px;font-size:13px}
@media (max-width:600px){.big{font-size:56px}.login{margin:20px auto}}
</style>
</head>
<body>

<div id="instalar" class="instalar"></div>

<div id="login" class="login card">
  <h2 style="margin-top:0"><img src="icons/icon-192.png" alt="">Portal da Liga</h2>
  <p class="mut">Digite o e-mail cadastrado na liga. Enviaremos um código de acesso.</p>
  <input id="email" type="email" placeholder="seu@email.com" autocomplete="email">
  <button id="btnCod" onclick="pedirCodigo()">Enviar código</button>
  <div id="blocoCod" style="display:none;margin-top:14px">
    <input id="codigo" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos" autocomplete="one-time-code">
    <button id="btnEnt" onclick="entrar()">Entrar</button>
  </div>
  <div id="msg" class="msg"></div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <div><b id="tNome"></b><span class="badge" id="tPapel"></span></div>
    <div class="acoes">
      <span id="tAtual" style="opacity:.8;font-size:12px"></span>
      <button class="sec mini" onclick="atualizar()" title="Atualizar">🔄</button>
      <button class="sec mini" onclick="sair()">Sair</button>
    </div>
  </div>
  <div class="wrap" id="conteudo"></div>
</div>

<div id="modal" class="modal" style="display:none" onclick="if(event.target===this)fecharEdicao()"><div class="box">
  <h3 id="mTitulo" style="margin-top:0"></h3>
  <label>Departamento</label><select id="mDep"></select>
  <label>Cargo</label><select id="mCargo"></select>
  <label>E-mail</label><input id="mEmail" type="email">
  <div id="mTelBox"><label>Telefone (com DDD)</label><input id="mTel" inputmode="tel"></div>
  <button id="mSalvar" onclick="salvarEdicao()">💾 Salvar dados</button>
  <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
  <div id="mPts">
    <label>Ajustar pontos (de -20 a +20)</label>
    <input id="mDelta" type="number" min="-20" max="20" placeholder="Ex.: -5 ou 5">
    <input id="mMotivo" placeholder="Motivo (obrigatório)">
    <button id="mAplicar" onclick="ajustarPts()">⭐ Aplicar pontos</button>
  </div>
  <div id="mMsg" class="msg" style="margin-top:8px"></div>
  <button class="sec" onclick="fecharEdicao()" style="margin-top:8px">Fechar</button>
</div></div>

<script src="config.js"></script>
<script>
var CFG = window.PORTAL_CONFIG || {};
var API_URL = String(CFG.API_URL || '');
var KEY_TK = 'portal_tk', KEY_EMAIL = 'portal_email', KEY_CACHE = 'portal_cache', KEY_INST = 'portal_instalar_off';
var token = null, D = null, aba = 'geral', edit = null, emCarga = false, ultimaCarga = 0;

function $(id){return document.getElementById(id);}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pct(x){return (x*100).toFixed(0)+'%';}
function pill(s){return '<span class="pill '+esc(s)+'">'+esc(s)+'</span>';}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function setTema(gestao){
  document.body.className=gestao?'gestao':'';
  var m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute('content',gestao?'#0F172A':'#0F766E');
}

/* ---------- comunicação com o Apps Script ---------- */
function api(acao,dados){
  if(API_URL.indexOf('https://script.google.com/')!==0){
    return Promise.reject(new Error('O app ainda não foi configurado: edite o arquivo config.js com a URL do Apps Script.'));
  }
  var ctrl=('AbortController' in window)?new AbortController():null;
  var timer=ctrl?setTimeout(function(){ctrl.abort();},90000):null;
  var corpo=JSON.stringify(Object.assign({acao:acao},dados||{}));
  // "text/plain" evita a checagem prévia (CORS preflight) que o Apps Script não responde
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:corpo,redirect:'follow',signal:ctrl?ctrl.signal:undefined})
    .then(function(r){
      if(timer)clearTimeout(timer);
      return r.json().catch(function(){throw new Error('Resposta inválida do servidor. Confira a URL no config.js e se a implantação está com acesso "Qualquer pessoa".');});
    },function(){
      if(timer)clearTimeout(timer);
      var e=new Error('Sem conexão com o servidor. Verifique a internet e tente de novo.');e.rede=true;throw e;
    })
    .then(function(j){
      if(!j||j.ok!==true)throw new Error((j&&j.erro)||'Erro inesperado.');
      return j.dados;
    });
}

/* ---------- login ---------- */
function falha(e){
  $('msg').textContent=(e&&e.message?e.message:e);
  $('btnCod').disabled=false;$('btnEnt').disabled=false;
}
function pedirCodigo(){
  var email=$('email').value.trim();
  if(!email){$('msg').textContent='Digite o seu e-mail.';return;}
  $('btnCod').disabled=true;$('msg').textContent='Enviando...';
  api('pedirCodigo',{email:email}).then(function(r){
    $('msg').textContent=r.msg;$('btnCod').disabled=false;
    if(r.ok){lsSet(KEY_EMAIL,email);$('blocoCod').style.display='block';$('codigo').focus();}
  }).catch(falha);
}
function entrar(){
  var codigo=$('codigo').value.trim();
  if(!codigo){$('msg').textContent='Digite o código recebido por e-mail.';return;}
  $('btnEnt').disabled=true;$('msg').textContent='Verificando...';
  api('entrar',{email:$('email').value.trim(),codigo:codigo}).then(function(r){
    $('btnEnt').disabled=false;
    if(!r.ok){$('msg').textContent=r.msg;return;}
    token=r.token;lsSet(KEY_TK,token);$('msg').textContent='';
    carregar(false,false);
  }).catch(falha);
}
function sair(local){
  if(token&&local!==true)api('sair',{token:token}).catch(function(){});
  lsDel(KEY_TK);lsDel(KEY_CACHE);token=null;D=null;
  $('app').style.display='none';$('login').style.display='block';
  setTema(false);$('blocoCod').style.display='none';$('codigo').value='';$('msg').textContent='';
  $('btnCod').disabled=false;$('btnEnt').disabled=false;
}

/* ---------- carga dos dados ---------- */
function lerCache(){try{return JSON.parse(lsGet(KEY_CACHE)||'null');}catch(e){return null;}}
function mostrarCarregando(){
  $('login').style.display='none';$('app').style.display='block';
  $('conteudo').innerHTML='<div class="card" style="text-align:center">Carregando…</div>';
}
function mostrarErroCarga(e){
  $('login').style.display='none';$('app').style.display='block';
  $('conteudo').innerHTML='<div class="card" style="text-align:center"><p>⚠️ '+esc(e&&e.message?e.message:e)+'</p>'+
    '<button onclick="carregar(false,false)">Tentar de novo</button></div>';
}
function carregar(manter,silencioso){
  if(emCarga)return;
  emCarga=true;
  if(silencioso)$('tAtual').textContent='Atualizando…';else mostrarCarregando();
  api('carregar',{token:token}).then(function(r){
    emCarga=false;
    if(r.erro){sair(true);$('msg').textContent='Sessão expirada. Entre novamente.';return;}
    D=r;ultimaCarga=Date.now();if(!manter)aba='geral';
    if(D.papel==='membro')lsSet(KEY_CACHE,JSON.stringify(D));else lsDel(KEY_CACHE);
    desenhar();
  }).catch(function(e){
    emCarga=false;
    if(e&&e.rede){
      var c=lerCache();
      if(c&&c.papel==='membro'){D=c;D.offline=true;desenhar();return;}
    }
    if(silencioso&&D){$('tAtual').textContent='Falha ao atualizar';return;}
    mostrarErroCarga(e);
  });
}
function atualizar(){if(token)carregar(true,true);}

function desenhar(){
  $('login').style.display='none';$('app').style.display='block';
  if(D.papel==='2fa'){
    setTema(true);$('tNome').textContent='🔒 '+D.nome;
    $('tPapel').textContent='Verificação';$('tAtual').textContent='';tela2fa();return;
  }
  setTema(D.papel==='gestao');
  $('tNome').textContent=(D.papel==='gestao'?'👑 ':'👋 ')+D.nome;
  $('tPapel').textContent=D.papel==='gestao'?'Diretoria':'Integrante';
  $('tAtual').textContent=D.offline?'Offline':('Atualizado '+D.atualizado);
  if(D.papel==='gestao')telaGestao();else telaMembro();
}

/* ---------- INTERFACE DO MEMBRO ---------- */
function telaMembro(){
  var e=D.eu,h='';
  if(D.offline)h+='<div class="offline">📴 Sem conexão. Mostrando os dados salvos em <b>'+esc(D.atualizado)+'</b>. Toque em 🔄 quando voltar a internet.</div>';
  h+=blocoGrupo();
  if(D.afast){
    h+='<div class="aviso">⏸️ <b>Você está afastado(a) da liga.</b> '+
      (D.afast.fim?'Seu afastamento vai de '+esc(D.afast.ini)+' até <b>'+esc(D.afast.fim)+'</b> ('+
      (D.afast.dias>=0?'faltam '+D.afast.dias+' dia(s)':'prazo vencido')+'). ':'')+
      (D.afast.origem?'Você volta para: '+esc(D.afast.origem)+'. ':'')+'Você receberá o formulário de retorno nas últimas semanas.</div>';
  }
  var larg=Math.max(0,Math.min(100,e.pontos));
  h+='<div class="card" style="text-align:center"><div class="mut">Sua pontuação</div><div class="big">'+esc(e.pontos)+'</div>'+
     '<div style="margin-top:8px">'+pill(e.status)+'</div>'+
     '<div class="bar"><i style="width:'+larg+'%"></i></div>'+
     '<div class="mut" style="margin-top:8px">URGENTE abaixo de '+D.limites.urgente+' · ATENÇÃO abaixo de '+D.limites.atencao+'</div></div>';
  h+='<div class="grid">'+
    '<div class="kpi"><small>Frequência</small><span>'+pct(e.freq)+'</span></div>'+
    '<div class="kpi"><small>Presenças</small><span>'+esc(e.total)+'</span></div>'+
    '<div class="kpi"><small>Faltas</small><span>'+esc(e.faltas)+'</span></div>'+
    '<div class="kpi"><small>Reuniões no mês '+esc(D.mes)+'</small><span>'+esc(D.reunioes)+'</span></div>'+
    (D.posicao?'<div class="kpi"><small>Posição no ranking</small><span>'+D.posicao+'º</span><div class="mut">de '+D.totalRanking+'</div></div>':'')+
    '</div>';
  h+='<div class="card"><b>Seus dados</b><table><tr><td class="mut">Nome</td><td>'+esc(e.nome)+'</td></tr>'+
    '<tr><td class="mut">Departamento</td><td>'+esc(e.depto||'—')+'</td></tr>'+
    '<tr><td class="mut">Cargo</td><td>'+esc(e.cargo)+'</td></tr>'+
    '<tr><td class="mut">Situação na reunião atual</td><td>'+esc(e.situacao||'—')+'</td></tr></table></div>';
  $('conteudo').innerHTML=h;
}

/* ---------- INTERFACE DA DIRETORIA ---------- */
function telaGestao(){
  var k=D.kpis;
  var h=blocoGrupo()+'<div class="grid">'+
   '<div class="kpi"><small>Integrantes</small><span>'+k.total+'</span></div>'+
   '<div class="kpi"><small>Frequência média</small><span>'+pct(k.mediaFreq)+'</span></div>'+
   '<div class="kpi"><small>Pontos (média)</small><span>'+k.mediaPontos+'</span></div>'+
   '<div class="kpi"><small>Em risco</small><span style="color:#EF4444">'+k.risco+'</span></div>'+
   '<div class="kpi"><small>Afastados</small><span>'+k.afastados+'</span></div>'+
   '<div class="kpi"><small>Reuniões · mês '+D.mes+'</small><span>'+D.reunioes+'</span></div></div>';
  h+='<div class="tabs">'+[['geral','📊 Visão geral'],['pessoas','👥 Integrantes'],['afast','⏸️ Afastados']].map(function(t){
    return '<button class="'+(aba===t[0]?'on':'')+'" onclick="aba=\''+t[0]+'\';telaGestao()">'+t[1]+'</button>';}).join('')+'</div>';
  if(aba==='geral')h+=abaGeral();else if(aba==='pessoas')h+=abaPessoas();else h+=abaAfast();
  $('conteudo').innerHTML=h;
  if(aba==='pessoas')filtrar();
}
function abaGeral(){
  var h='<div class="card"><b>🏆 Top 3 do mês</b><table>'+(D.top3.length?D.top3.map(function(r,i){
    return '<tr><td>'+['🥇','🥈','🥉'][i]+'</td><td><b>'+esc(r.nome)+'</b></td><td>'+r.pontos+' pts</td><td class="mut">'+r.total+' presenças · '+r.faltas+' faltas</td></tr>';}).join(''):'<tr><td class="mut">Sem dados ainda.</td></tr>')+'</table></div>';
  h+='<div class="card"><b>🏢 Departamentos</b><div style="margin-top:10px">'+D.deptos.map(function(d){
    return '<div class="dep" style="border-color:'+esc(d.cor)+'"><b>'+esc(d.nome)+'</b> — '+d.qtd+' pessoa(s) · média '+(d.media===null?'—':d.media)+' pts · '+d.risco+' em risco'+
      (d.diretoria.length?'<div class="mut">👑 '+d.diretoria.map(esc).join(' / ')+'</div>':'')+'</div>';}).join('')+'</div></div>';
  var urg=D.membros.filter(function(m){return !m.afastado&&m.status==='URGENTE';});
  h+='<div class="card"><b>🚨 Em URGENTE ('+urg.length+')</b>'+(urg.length?'<div class="scroll"><table>'+urg.map(function(m){
    return '<tr><td>'+esc(m.nome)+'</td><td>'+esc(m.depto||'—')+'</td><td><b>'+m.pontos+'</b> pts</td><td class="mut">'+esc(m.email)+' · '+esc(m.telefone)+'</td></tr>';}).join('')+'</table></div>':'<p class="mut">🎉 Ninguém em URGENTE.</p>')+'</div>';
  return h;
}
function abaPessoas(){
  var ops=D.deptos.map(function(d){return '<option>'+esc(d.nome)+'</option>';}).join('');
  return '<div class="card"><div class="filtros"><input id="fBusca" placeholder="🔎 Buscar nome ou e-mail" oninput="filtrar()">'+
   '<select id="fDep" onchange="filtrar()"><option value="">Todos os departamentos</option>'+ops+'</select>'+
   '<select id="fSt" onchange="filtrar()"><option value="">Todos os status</option><option>URGENTE</option><option>ATENÇÃO</option><option>REGULAR</option></select></div>'+
   '<div class="scroll"><table><thead><tr><th>Integrante</th><th>Depto.</th><th>Cargo</th><th>Pontos</th><th>Status</th><th>Freq.</th><th>Faltas</th><th>Reunião atual</th><th>Contato</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>';
}
function filtrar(){
  var b=($('fBusca').value||'').toLowerCase(),d=$('fDep').value,s=$('fSt').value;
  var l=D.membros.filter(function(m){
    return (!b||(m.nome+' '+m.email).toLowerCase().indexOf(b)!==-1)&&(!d||m.depto===d)&&(!s||(m.status===s&&!m.afastado));});
  $('tb').innerHTML=l.map(function(m){
    var i=D.membros.indexOf(m);
    var pode=D.dono||m.cargo!=='Diretoria';
    return '<tr><td><b>'+esc(m.nome)+'</b></td><td>'+esc(m.depto||'—')+'</td><td>'+esc(m.cargo)+'</td><td><b>'+m.pontos+'</b></td><td>'+
     (m.afastado?'<span class="pill ATENÇÃO">⏸️ Afastado</span>':pill(m.status))+'</td><td>'+pct(m.freq)+'</td><td>'+m.faltas+'</td><td>'+esc(m.situacao||'—')+
     '</td><td class="mut">'+esc(m.email)+'<br>'+esc(m.telefone)+'</td><td>'+
     (pode?'<button class="mini" onclick="abrirEdicao('+i+')">✏️ Editar</button>':'🔒')+'</td></tr>';}).join('')||'<tr><td colspan="10" class="mut">Nada encontrado.</td></tr>';
}
function abaAfast(){
  if(!D.afastados.length)return '<div class="card mut">Ninguém está afastado no momento.</div>';
  return '<div class="card scroll"><table><thead><tr><th>Integrante</th><th>Desde</th><th>Até</th><th>Prazo</th><th>Volta para</th><th>Contato</th></tr></thead><tbody>'+
   D.afastados.map(function(a){
    var p=a.dias===null?'—':(a.dias>=0?'faltam '+a.dias+' dia(s)':'<span class="pill URGENTE">vencido há '+(-a.dias)+' dia(s)</span>');
    return '<tr><td><b>'+esc(a.nome)+'</b></td><td>'+esc(a.ini||'—')+'</td><td>'+esc(a.fim||'—')+'</td><td>'+p+'</td><td>'+esc(a.origem||'—')+
     '</td><td class="mut">'+esc(a.email)+'<br>'+esc(a.telefone)+'</td></tr>';}).join('')+'</tbody></table></div>';
}

/* ---------- EDIÇÃO ---------- */
function abrirEdicao(i){
  edit=D.membros[i];var m=edit;
  $('mTitulo').textContent='✏️ '+m.nome;
  $('mDep').innerHTML=D.deptos.map(function(d){return '<option'+(d.nome===m.depto?' selected':'')+'>'+esc(d.nome)+'</option>';}).join('');
  var cargos=['Membro','Secretário','Outro'];
  if(D.dono||m.cargo==='Diretoria')cargos.push('Diretoria');
  $('mCargo').innerHTML=cargos.map(function(c){return '<option'+(c===m.cargo?' selected':'')+'>'+c+'</option>';}).join('');
  $('mDep').disabled=!!m.afastado;$('mCargo').disabled=!!m.afastado;
  $('mEmail').value=m.email||'';$('mTel').value=m.telefone||'';
  $('mDelta').value='';$('mMotivo').value='';
  $('mPts').style.display=m.afastado?'none':'block';
  $('mTelBox').style.display=D.dono?'block':'none';
  $('mMsg').textContent='';$('modal').style.display='flex';
}
function fecharEdicao(){$('modal').style.display='none';$('mSalvar').disabled=false;$('mAplicar').disabled=false;}
function erroModal(e){
  $('mMsg').textContent='⚠️ '+(e&&e.message?e.message:e);
  $('mSalvar').disabled=false;$('mAplicar').disabled=false;
}
function salvarEdicao(){
  $('mSalvar').disabled=true;$('mMsg').textContent='Salvando... (pode levar alguns segundos)';
  api('editarMembro',{token:token,chave:edit.k,campos:{depto:$('mDep').value,cargo:$('mCargo').value,email:$('mEmail').value,telefone:$('mTel').value}})
    .then(function(){fecharEdicao();carregar(true,true);}).catch(erroModal);
}
function ajustarPts(){
  $('mAplicar').disabled=true;$('mMsg').textContent='Aplicando...';
  api('ajustarPontos',{token:token,chave:edit.k,delta:$('mDelta').value,motivo:$('mMotivo').value})
    .then(function(){fecharEdicao();carregar(true,true);}).catch(erroModal);
}

/* ---------- SEGURANÇA DA DIRETORIA E GRUPO ---------- */
function tela2fa(){
  $('conteudo').innerHTML='<div class="card" style="max-width:520px;margin:30px auto">'+
   '<h2 style="margin-top:0">🔒 Segurança da Diretoria</h2>'+
   '<p>Como a Diretoria pode editar os dados dos integrantes, ative a <b>verificação em duas etapas</b> na sua conta Google antes de continuar.</p>'+
   '<ol><li>Abra <a href="https://myaccount.google.com/signinoptions/two-step-verification" target="_blank" rel="noopener" style="color:var(--pri)">a página de verificação em duas etapas</a></li>'+
   '<li>Siga os passos do Google (prefira o app autenticador ou a confirmação pelo celular)</li>'+
   '<li>Volte aqui e confirme abaixo</li></ol>'+
   '<label style="display:flex;gap:8px;align-items:flex-start;font-size:14px"><input type="checkbox" id="c2fa" style="width:auto;margin:3px 0 0" onchange="$(\'b2fa\').disabled=!this.checked"> Confirmo que ativei a verificação em duas etapas na conta do e-mail que uso aqui.</label>'+
   '<button id="b2fa" onclick="confirmar2fa()" disabled style="margin-top:12px">Continuar</button><div id="m2fa" class="msg"></div></div>';
}
function confirmar2fa(){
  $('b2fa').disabled=true;
  api('confirmar2fa',{token:token}).then(function(){carregar(false,false);})
   .catch(function(e){$('m2fa').textContent='Erro: '+(e&&e.message?e.message:e);$('b2fa').disabled=false;});
}
function blocoGrupo(){
  if(!D.grupo||D.grupo.indexOf('https://chat.whatsapp.com/')!==0)return '';
  return '<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'+
   '<span>💬 Os avisos gerais da liga ficam no grupo do WhatsApp</span>'+
   '<a href="'+esc(D.grupo)+'" target="_blank" rel="noopener"><button>Abrir grupo</button></a></div>';
}

/* ---------- INSTALAÇÃO COMO APP ---------- */
var evInstalar=null;
function ehStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
function ehIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function mostrarInstalar(){
  if(ehStandalone()||lsGet(KEY_INST)==='1')return;
  var box=$('instalar'),x='<button class="x" onclick="fecharInstalar()" aria-label="Fechar">✕</button>';
  if(evInstalar){
    box.innerHTML='<span>📲 <b>Instale o app</b> na tela inicial</span><span><button onclick="instalar()">Instalar</button>'+x+'</span>';
  }else if(ehIOS()){
    box.innerHTML='<span>📲 <b>Instale o app:</b> toque em <b>Compartilhar</b> (⬆️) e depois em <b>Adicionar à Tela de Início</b>.</span>'+x;
  }else return;
  box.style.display='flex';
}
function fecharInstalar(){lsSet(KEY_INST,'1');$('instalar').style.display='none';}
function instalar(){
  if(!evInstalar)return;
  evInstalar.prompt();
  evInstalar.userChoice.then(function(){evInstalar=null;$('instalar').style.display='none';});
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();evInstalar=e;mostrarInstalar();});
window.addEventListener('appinstalled',function(){evInstalar=null;$('instalar').style.display='none';});

/* ---------- INÍCIO ---------- */
if('serviceWorker' in navigator){
  var tinhaController=!!navigator.serviceWorker.controller,recarregando=false;
  navigator.serviceWorker.register('sw.js').catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!tinhaController||recarregando)return;   // só recarrega quando é uma ATUALIZAÇÃO do app
    recarregando=true;location.reload();
  });
}
// ao voltar para o app depois de um tempo, atualiza os dados sem piscar a tela
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&token&&!emCarga&&Date.now()-ultimaCarga>120000&&$('modal').style.display!=='flex'){
    carregar(true,true);
  }
});
(function(){
  var e=lsGet(KEY_EMAIL);if(e)$('email').value=e;
  mostrarInstalar();
  var t=lsGet(KEY_TK);
  if(t){token=t;carregar(false,false);}
})();
</script>
